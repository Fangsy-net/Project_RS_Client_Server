<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Dokter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">

    <div class="flex h-screen">
        <div class="w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
            <div>
                <h1 class="text-xl font-bold tracking-wider mb-8 text-blue-400">JADWAL DOKTER<span class="text-xs block text-slate-400">Klinik Management</span></h1>
                <nav class="space-y-2">
                    <a href="dashboard-pasien.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-slate-800 text-slate-300">Data Pasien</a>
                    <a href="dashboard-dokter.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-slate-800 text-slate-300">Data Dokter</a>
                    <a href="dashboard-jadwal.html" class="block py-2.5 px-4 rounded transition duration-200 bg-blue-600 text-white font-semibold">Jadwal Dokter</a>
                </nav>
            </div>
            <button onclick="localStorage.clear(); window.location.href='index.html';" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded text-sm font-semibold transition">Keluar Sistem</button>
        </div>

        

        <div class="flex-1 p-10 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Database Jadwal Praktek Dokter</h2>
                    <p class="text-sm text-slate-500">Kelola jam kerja dan shift operasional dokter klinik.</p>
                </div>
                <button onclick="toggleModal(true); loadDokterUntukDropdown();" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow transition font-medium text-sm">+ Tambah Jadwal Baru</button>
            </div>

            <div id="error-message-jadwal" class="text-red-600 font-semibold mb-4"></div>

            <div class="bg-white rounded-xl shadow overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-white text-sm uppercase tracking-wider">
                            <th class="py-4 px-6 font-semibold">No</th>
                            <th class="py-4 px-6 font-semibold">Nama Dokter</th>
                            <th class="py-4 px-6 font-semibold">Spesialisasi</th>
                            <th class="py-4 px-6 font-semibold">Hari Praktek</th>
                            <th class="py-4 px-6 font-semibold">Jam Operasional</th>
                            <th class="py-4 px-6 font-semibold">Status</th>
                            <th class="py-4 px-6 font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body-jadwal" class="divide-y divide-slate-200 text-slate-700 text-sm">
                        <tr>
                            <td colspan="7" class="py-8 text-center text-slate-400 italic">Sedang memuat data jadwal...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-jadwal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl p-6 w-[450px] shadow-2xl transition-all transform scale-100">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-800">Registrasi Jadwal Shift Baru</h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="form-jadwal" onsubmit="simpanJadwalBaru(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Dokter Penanggung Jawab</label>
                    <select id="select-dokter" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="">-- Memuat Daftar Dokter... --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Hari Praktek</label>
                    <select id="input-hari" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="">-- Pilih Hari --</option>
                        <option value="Senin">Senin</option>
                        <option value="Selasa">Selasa</option>
                        <option value="Rabu">Rabu</option>
                        <option value="Kamis">Kamis</option>
                        <option value="Jumat">Jumat</option>
                        <option value="Sabtu">Sabtu</option>
                        <option value="Minggu">Minggu</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Jam Mulai</label>
                        <input type="time" id="input-jam-mulai" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Jam Selesai</label>
                        <input type="time" id="input-jam-selesai" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Status Kehadiran</label>
                    <select id="select-status" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Aktif">Aktif</option>
                        <option value="Cuti">Cuti</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow transition">Simpan ke Database</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Fungsi tambahan buat buka-tutup modal pop-up secara estetik
        function toggleModal(show) {
            const modal = document.getElementById('modal-jadwal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('form-jadwal').reset();
            }
        }

        
        const API_URL = 'http://localhost:3000/api/jadwal';
        const token = localStorage.getItem('token');

        async function fetchJadwal() {
            try {
                const response = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Gagal load jadwal.');

                const tbody = document.getElementById('tabel-body-jadwal');
                tbody.innerHTML = '';

                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400">Belum ada jadwal praktek dokter terdaftar.</td></tr>';
                    return;
                }

                data.forEach((jadwal, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="py-4 px-6">${index + 1}</td>
                            <td class="py-4 px-6 font-semibold text-slate-900">${jadwal.dokter ? jadwal.dokter.namaDokter : 'Dokter Terhapus'}</td>
                            <td class="py-4 px-6 text-slate-500">${jadwal.dokter ? jadwal.dokter.spesialisasi : '-'}</td>
                            <td class="py-4 px-6">${jadwal.hari}</td>
                            <td class="py-4 px-6 font-mono">${jadwal.jamMulai} - ${jadwal.jamSelesai}</td>
                            <td class="py-4 px-6">
                                <span class="px-2.5 py-1 text-xs font-bold rounded-full ${jadwal.status === 'Aktif' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                    ${jadwal.status}
                                </span>
                            </td>
                            <td class="py-4 px-6">
                                <button class="text-red-600 hover:text-red-900 font-medium text-xs uppercase tracking-wider" onclick="hapusJadwal(${jadwal.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                document.getElementById('error-message-jadwal').innerText = "Gagal Ambil Jadwal: " + error.message;
            }
        }

        async function loadDokterUntukDropdown() {
            try {
                const res = await fetch('http://localhost:3000/api/dokter', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const selectDokter = document.getElementById('select-dokter');
                selectDokter.innerHTML = '<option value="">-- Pilih Dokter --</option>';
                data.forEach(dokter => {
                    selectDokter.innerHTML += `<option value="${dokter.id}">${dokter.namaDokter} (${dokter.spesialisasi})</option>`;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function simpanJadwalBaru(event) {
            event.preventDefault();
            const dokterId = document.getElementById('select-dokter').value;
            const hari = document.getElementById('input-hari').value;
            const jamMulai = document.getElementById('input-jam-mulai').value;
            const jamSelesai = document.getElementById('input-jam-selesai').value;
            const status = document.getElementById('select-status').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ dokterId, hari, jamMulai, jamSelesai, status })
                });
                const result = await response.json();
                if (!response.ok) return alert(`Gagal: ${result.message}`);
                
                alert('Jadwal dokter berhasil disimpan, Mek!');
                toggleModal(false);
                fetchJadwal();
            } catch (error) {
                alert('Eror Server: ' + error.message);
            }
        }

        async function hapusJadwal(id) {
            if (!confirm('Yakin mau hapus jadwal ini, Tot?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                alert(result.message);
                fetchJadwal();
            } catch (error) {
                alert(error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchJadwal);
    </script>
</body>
</html>
