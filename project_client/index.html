<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Klinik UMKM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-gradient-to-br from-slate-100 via-slate-50 to-white min-h-screen flex items-center justify-center px-4">
    
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-blue-600 px-8 py-10 text-center text-white">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-slate-900 mb-4 shadow-lg shadow-slate-900/20">
                <i class="fa-solid fa-hospital text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">Selamat Datang</h1>
            <p class="mt-2 text-slate-200">Masuk untuk mengelola data pasien dan dokter klinik.</p>
        </div>

        <div class="p-8">
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700">Username</label>
                    <input id="username" type="text" required placeholder="Username Anda"
                        class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                    <input id="password" type="password" required placeholder="Password Anda"
                        class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div id="login-error" class="hidden rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

                <button type="submit" class="w-full rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-700 active:scale-[0.99]">
                    Masuk Sekarang
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-500">
                Gunakan akun admin, resepsionis, atau dokter untuk masuk.
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. AUTO-REDIRECT CHECKER (Biar gak usah login ulang kalau token masih nempel)
        // =========================================================================
        const token = localStorage.getItem('token');
        const savedRole = localStorage.getItem('userRole');

        if (token) {
            if (savedRole === 'dokter') {
                window.location.href = './dashboard-dokter.html';
            } else if (savedRole === 'resepsionis') {
                window.location.href = './dashboard-pasien.html'; 
            } 
        }

        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');

        // =========================================================================
        // 2. PROSES TEMBAK API LOGIN (SUBMIT EVENT)
        // =========================================================================
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('hidden');
            errorBox.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Login gagal. Periksa kembali username dan password.');
                }

                // Amankan berkas autentikasi ke LocalStorage Browser
                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.user.role);
                localStorage.setItem('username', data.user.username);
                
                // Jika user yang login adalah dokter dan punya kaitan dokterId, amankan juga!
                if (data.user.dokterId) {
                    localStorage.setItem('dokterId', data.user.dokterId);
                }

                // =========================================================================
                // 3. DISTRIBUSI HALAMAN SESUAI ROLE KASTA BACKEND
                // =========================================================================
                if (data.user.role === 'dokter') {
                    window.location.href = './dashboard-dokter.html';
                } else if (data.user.role === 'resepsionis') {
                    window.location.href = './dashboard-pasien.html'; // Lempar ke dashboard utama
                } else {
                    window.location.href = './dashboard-pasien.html';
                }

            } catch (error) {
                // Tampilkan pesan kegagalan dari catch blok Express ke text box merah
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
